# Inserts a blank line between shell prompts
add_newline = true

format = """
╭─$directory${env_var.STARSHIP_GIT_BRANCH} (${env_var.STARSHIP_GIT_MODIFIED}${env_var.STARSHIP_GIT_STAGED}${env_var.STARSHIP_GIT_UNTRACKED}${env_var.STARSHIP_GIT_DELETED} )
╰──$character"""

# Right-aligned elements (rbenv + time)
right_format = """$ruby$time"""

[directory]
style = "bold cyan"
format = " [$path]($style)"
truncate_to_repo = false
truncation_length = 0

[time]
disabled = false
time_format = "%H:%M:%S"
format = " [](white) [$time](yellow)"

[character]
success_symbol = '[\$](bold green)'
error_symbol = '[\$](bold red)'

# Git segments are computed asynchronously by ~/bin/git-prompt-async.zsh, which exports these vars
[env_var.STARSHIP_GIT_BRANCH]
format = " [ $env_value](purple)" # U+F126, a branch symbol

[env_var.STARSHIP_GIT_STAGED]
format = "[+$env_value](green) "

[env_var.STARSHIP_GIT_MODIFIED]
format = "[!$env_value](yellow) " # unstaged changes

[env_var.STARSHIP_GIT_UNTRACKED]
format = "[?$env_value](yellow) "

[env_var.STARSHIP_GIT_DELETED]
format = "[-$env_value](red) "

[ruby]
symbol = " " # U+F219, Unicode Ruby
format = " [$symbol$version](red)"