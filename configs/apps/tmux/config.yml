symlinks:
  - src: .tmux.conf
    dest: $HOME/.tmux.conf
  - src: set_tmux_agent_status
    dest: $HOME/bin/set_tmux_agent_status
  - src: clear_tmux_agent_status_if_no_agents
    dest: $HOME/bin/clear_tmux_agent_status_if_no_agents
  - src: clean-claude-copy
    dest: $HOME/bin/clean-claude-copy
  - src: clean-codex-copy
    dest: $HOME/bin/clean-codex-copy
  - src: clean-agent-copy
    dest: $HOME/bin/clean-agent-copy
  - src: tmux-app-key
    dest: $HOME/bin/tmux-app-key
  - src: tmux-copy-mode-passthrough-binds
    dest: $HOME/bin/tmux-copy-mode-passthrough-binds
