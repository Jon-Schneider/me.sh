model = "gpt-5.6-sol"
model_reasoning_effort = "high"
approvals_reviewer = "user"

[features]
computer_use = false
hooks = true
plugins = false

[agents]
max_concurrent_threads_per_session = 32

[tui]
status_line = [
    "model-with-reasoning",
    "context-used",
    "five-hour-limit",
    "weekly-limit",
]
status_line_use_colors = true

[notice]
hide_rate_limit_model_nudge = true
