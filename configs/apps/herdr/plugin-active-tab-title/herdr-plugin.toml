id = "me.active-tab-title"
name = "Active Tab Title"
version = "1.0.0"
min_herdr_version = "0.8.0"
description = "Mirror the focused pane's title (pane label, else agent name) into its tab title, updating on focus changes"
platforms = ["macos"]

# Event-driven, active-cwd style: herdr spawns this script on pane events
# and once at startup. Only the focused tab is managed — background tabs
# keep whatever label they had when last visible. A manual tab rename wins
# until focus moves to a different pane.

[[startup]]
command = ["/usr/bin/python3", "active_tab_title_on_event.py"]

[[events]]
on = "pane.focused"
command = ["/usr/bin/python3", "active_tab_title_on_event.py"]

[[events]]
on = "pane.created"
command = ["/usr/bin/python3", "active_tab_title_on_event.py"]

[[events]]
on = "pane.updated"
command = ["/usr/bin/python3", "active_tab_title_on_event.py"]

[[events]]
on = "pane.moved"
command = ["/usr/bin/python3", "active_tab_title_on_event.py"]

[[events]]
on = "pane.exited"
command = ["/usr/bin/python3", "active_tab_title_on_event.py"]
