# Managed in ~/Developer/jsc/me.sh (configs/apps/herdr). Symlinked into
# ~/.config/herdr/config.toml by configs/apps/herdr/config.yml.
#
# Split/close even-layout behavior is provided by the me.even-panes herdr
# plugin (plugin/ in this directory): it evens out panes whenever
# a tab's pane count changes (split, close, or pane move), regardless of how
# the change was made. Manual resizes and zoom are left untouched.
#
# Active-pane cwd is provided by the me.active-cwd plugin
# (plugin-active-cwd/ in this directory): an event-driven handler — no
# daemon — that watches pane focus/create/exit events and reports workspace
# metadata. Herdr 0.7.x fires no plugin event when a pane's cwd changes, so
# a zsh chpwd hook (.zshrc) also spawns the handler on bare `cd`.
# $active_cwd is the ~-substituted path; $active_repo adds "Repo (worktree)"
# for worktree-backed
# spaces. Every space carries its own row once its panes have reported a
# cwd; rows whose tokens are all missing disappear, so plain spaces show
# only the path.

# Must stay above every table header: bare keys below a header belong to
# that table, and herdr only knows top-level onboarding.
onboarding = false

[ui.sidebar.spaces]
rows = [
  ["state_icon", "workspace"],
  ["branch", "git_status"],
  ["$active_repo", "$active_cwd"],
]

# Space rearranging is provided by the me.space-mover plugin
# (plugin-move-space/ in this directory). Its move-left/move-right actions
# shift the focused space one slot sideways in the sidebar, keeping worktree
# groups together. The herdr-app-key shift+left/right entries below invoke
# those actions as their non-xlent fallback.

# Prefix key: ctrl+space. All the
# default prefix+... bindings below keep working; only the leader changes.

[keys]
prefix = "ctrl+space"
toggle_sidebar = ["prefix+b", "cmd+shift+l"]
# Cmd+Shift+R renames the focused space.
rename_workspace = "cmd+shift+r"
new_workspace = ["prefix+shift+n", "cmd+n"]
new_tab = ["prefix+shift+t", "cmd+t"]
rename_tab = "prefix+t"
new_worktree = ["prefix+shift+g", "cmd+x"]
detach = ["prefix+q", "cmd+q"]
# Open an existing Git worktree as a nested space in its repository group.
open_worktree = "cmd+shift+x"

# Ghostty forwards these chords using its negotiated keyboard protocol.
# Keep the prefix bindings available for other terminals.
focus_pane_left = ["prefix+h", "cmd+shift+left"]
focus_pane_right = ["prefix+l", "cmd+shift+right"]
focus_pane_up = ["prefix+k", "cmd+shift+up"]
focus_pane_down = ["prefix+j", "cmd+shift+down"]
swap_pane_up = ["prefix+shift+k", "ctrl+shift+up"]
swap_pane_down = ["prefix+shift+j", "ctrl+shift+down"]
split_vertical = ["prefix+v", "cmd+enter"]
split_horizontal = ["prefix+minus", "cmd+shift+enter"]
# Karabiner turns Cmd+Ctrl+arrows into F13–F16 to avoid AppKit NSBeep.
previous_workspace = "f15"
next_workspace = "f16"

# Shift+arrows no longer bind directly: they belong to the xlent-aware
# ~/bin/herdr-app-key router below (xlent range selection when xlent owns the
# focused pane; workspace cycling / space mover otherwise).

# Cmd+W closes by preference: focused split pane, else active tab (no splits),
# else the workspace when it holds the last tab. Ghostty sends raw Ctrl+W and
# Herdr intercepts it before panes see it.
# close-focused.sh first passes Ctrl+W through to foreground TUI apps that
# own that key (micro = Quit, xlent = clear).

# Built-in tab cycling moved off prefix+n/p so the [[keys.command]] walkers
# below own those keys unambiguously. Native per-workspace cycling also
# handles Cmd+Ctrl+Left/Right via Karabiner's F13/F14.
# NB: keep these above any [[keys.command]] header — bare keys after one are
# absorbed into that array element instead of [keys].
next_tab = ["prefix+alt+n", "f14"]
previous_tab = ["prefix+alt+p", "f13"]

# Ctrl+Shift+Left/Right moves through panes, then
# tabs and workspaces of the same project; past either end creates a space.
# Live focus and a session lock let repeated presses follow the moved pane,
# including tabs that contain only one pane.
[[keys.command]]
key = ["prefix+shift+h", "ctrl+shift+left"]
type = "shell"
command = "/usr/bin/python3 $HOME/Developer/jsc/me.sh/configs/apps/herdr/pane-step.py left"
description = "move pane left across project tabs and spaces"

[[keys.command]]
key = ["prefix+shift+l", "ctrl+shift+right"]
type = "shell"
command = "/usr/bin/python3 $HOME/Developer/jsc/me.sh/configs/apps/herdr/pane-step.py right"
description = "move pane right across project tabs and spaces"

[[keys.command]]
key = "ctrl+w"
type = "shell"
command = "$HOME/Developer/jsc/me.sh/configs/apps/herdr/close-focused.sh"
description = "close pane / tab / workspace"

# Option-splits keep focus on the original pane; use an explicit API target.
[[keys.command]]
key = "cmd+alt+enter"
type = "shell"
command = "/usr/bin/python3 $HOME/Developer/jsc/me.sh/configs/apps/herdr/split-focused.py right"
description = "split right without changing focus"

[[keys.command]]
key = "cmd+shift+alt+enter"
type = "shell"
command = "/usr/bin/python3 $HOME/Developer/jsc/me.sh/configs/apps/herdr/split-focused.py down"
description = "split down without changing focus"

[theme]
name = "catppuccin"
auto_switch = false

[ui]
agent_panel_sort = "priority"
prompt_new_tab_name = false
show_agent_labels_on_pane_borders = true
right_click_passthrough_modifier = "option"

# ☕ while the me.caffeinate plugin (plugin-caffeinate/ in this directory)
# holds a `caffeinate -i` assertion, i.e. an agent is working or just finished
# inside its 30-second grace period. Herdr plugins cannot register a tab-bar
# segment themselves, so the plugin publishes a state file and this command
# reads it — it never queries agents, so the 5s poll is nearly free.
tab_bar_right = [
  { type = "command", command = "$HOME/Developer/jsc/me.sh/configs/apps/herdr/plugin-caffeinate/bin/status-indicator $HOME/.local/state/herdr/plugins/me.caffeinate", interval_seconds = 5, timeout_seconds = 1 },
]

# Agent rows: state icon + workspace + short title (pt -t, typically a
# ticket key) + agent name on one line; the body (pt -b, or bare `pt words`)
# is word-wrapped onto up to two extra lines. Tokens are reported by ~/bin/pt
# (source me.pt) — the shared applier used both by manual pt calls and by
# per-machine pane-title hooks registered in agent configs' overlay fragments,
# e.g. "● me.sh · SHP-399 · pi" + wrapped summary lines. Rows whose tokens are
# all missing disappear, so untitled agents stay one line. herdr has no native
# text wrapping — this is emulated script-side.
[ui.sidebar.agents]
# Inline { token = ..., dim = false } style tables: herdr renders agent-panel
# tokens (agent name + custom $tokens) with the same overlay0 gray as the
# space panel's branch/cwd rows PLUS a dim modifier, which made them near-
# unreadable. dim=false drops just that modifier so these match the lighter
# gray of the branch/cwd lines exactly, whatever the theme resolves
# overlay0 to.
rows = [
  ["state_icon", "workspace", { token = "$title_key", dim = false }, { token = "agent", dim = false }],
  [{ token = "$title_sum1", dim = false }],
  [{ token = "$title_sum2", dim = false }],
]

[ui.toast]
delivery = "system"

# Cross-workspace tab walking via ~/bin/herdr-tab-step: steps through every
# tab of every workspace in sidebar display order (including Herdr's grouped
# worktree-tree projection) and wraps globally. Direct chords avoid injected
# prefix sequences being mistaken for committed text by Kitty keyboard mode.
[[keys.command]]
key = ["prefix+n", "ctrl+tab"]
type = "shell"
command = "$HOME/Developer/jsc/me.sh/configs/apps/herdr/tab-step.sh next"
description = "next tab across workspaces"

[[keys.command]]
key = ["prefix+p", "ctrl+shift+tab"]
type = "shell"
command = "$HOME/Developer/jsc/me.sh/configs/apps/herdr/tab-step.sh previous"
description = "previous tab across workspaces"

# App-aware chords. ~/bin/herdr-app-key forwards copy to xlent, micro, or Codex
# when one owns the focused pane; otherwise:
#   save -> hunkdiff send-review (what Cmd+S did before the router)
#   copy -> no-op in shells (Ctrl+C would interrupt them)
#   shift+arrows -> xlent range selection when possible, else the tmux-era
#     fallbacks: Shift+Left/Right move the focused space (me.space-mover),
#     Shift+Up/Down cycle workspaces in sidebar order.
# Cmd+X creates a worktree; Cmd+V stays Ghostty's native paste.
[[keys.command]]
key = ["prefix+shift+s", "cmd+s"]
type = "shell"
command = "$HOME/bin/herdr-app-key save"
description = "save in xlent/micro"

[[keys.command]]
key = ["prefix+shift+f", "cmd+c"]
type = "shell"
command = "$HOME/bin/herdr-app-key copy"
description = "copy in xlent/micro/Codex"

[[keys.command]]
key = "shift+up"
type = "shell"
command = "$HOME/bin/herdr-app-key up"
description = "xlent range up / previous workspace"

[[keys.command]]
key = "shift+down"
type = "shell"
command = "$HOME/bin/herdr-app-key down"
description = "xlent range down / next workspace"

[[keys.command]]
key = "shift+left"
type = "shell"
command = "$HOME/bin/herdr-app-key left"
description = "xlent range left / move space left"

[[keys.command]]
key = "shift+right"
type = "shell"
command = "$HOME/bin/herdr-app-key right"
description = "xlent range right / move space right"

[[keys.command]]
key = "cmd+r"
type = "plugin_action"
command = "jhochenbaum.hunkdiff.review"
description = "review changes in hunk"

[[keys.command]]
key = "cmd+shift+f"
type = "plugin_action"
command = "wilbeibi.catchup.fork"
description = "fork session in a new pane"

[[keys.command]]
key = "cmd+z"
type = "plugin_action"
command = "me.active-tab-title.zoom-toggle"
description = "toggle pane zoom and refresh tab title"
