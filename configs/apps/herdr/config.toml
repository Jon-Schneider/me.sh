# Managed in ~/Developer/jsc/me.sh (configs/apps/herdr). Symlinked into
# ~/.config/herdr/config.toml by configs/apps/herdr/config.yml.
#
# Split/close even-layout behavior is provided by the me.even-panes herdr
# plugin (plugin/ in this directory): it evens out panes tmux-style whenever
# a tab's pane count changes (split, close, or pane move), regardless of how
# the change was made. Manual resizes and zoom are left untouched.
#
# Active-pane cwd is provided by the me.active-cwd plugin
# (plugin-active-cwd/ in this directory): an event-driven handler — no
# daemon — that watches pane focus/create/exit events and reports workspace
# metadata. Herdr 0.7.x fires no plugin event when a pane's cwd changes, so
# a zsh chpwd hook (.zshrc) also spawns the handler on bare `cd`.
# $active_cwd is the ~-substituted path, like the right side of the tmux
# status bar; $active_repo adds "Repo (worktree)" for worktree-backed
# spaces. Every space carries its own row once its panes have reported a
# cwd; rows whose tokens are all missing disappear, so plain spaces show
# only the path.

# Must stay above every table header: bare keys below a header belong to
# that table, and herdr only knows top-level onboarding.
onboarding = false

[ui.sidebar.spaces]
rows = [
  ["state_icon", "workspace"],
  ["branch", "git_status"],
  ["$active_repo", "$active_cwd"],
]

# Space rearranging is provided by the me.space-mover plugin
# (plugin-move-space/ in this directory). Its move-left/move-right actions
# shift the focused space one slot sideways in the sidebar, keeping worktree
# groups together. The [keys.command] entries below bind Shift+Left/Right to
# those actions when Herdr runs standalone. Inside tmux, tmux consumes those
# keys before Herdr sees them, so tmux-app-key detects Herdr-owned panes and
# invokes the same actions instead.

# Prefix key: ctrl+space (replaces tmux's C-b muscle memory). All the
# default prefix+... bindings below keep working; only the leader changes.

[keys]
prefix = "ctrl+space"
# tmux muscle memory: prefix+, renames the focused space (default is
# prefix+shift+w).
rename_workspace = "prefix+comma"
new_tab = "prefix+shift+t"
rename_tab = "prefix+t"

# Cmd+Shift+Left/Right focus panes: Ghostty sends prefix+h / prefix+l, which
# hit the focus_pane_* defaults below. (Direct ctrl+shift+arrow chords were
# tried and not recognized by herdr at runtime.)

# Cycle workspaces (tmux era: Shift+Up/Down ran HerdrPrevious/NextWorkspace).
previous_workspace = "shift+up"
next_workspace = "shift+down"

# Cmd+W closes by preference: focused split pane, else active tab (no splits),
# else the workspace when it holds the last tab. Ghostty sends raw Ctrl+W and
# herdr intercepts it before panes see it (tmux did the same via bind -n C-w).
# close-focused.sh first passes Ctrl+W through to foreground TUI apps that
# own that key (micro = Quit, xlent = clear), matching tmux-app-key's old
# process check.

# Built-in tab cycling moved off prefix+n/p so the [[keys.command]] walkers
# below own those keys unambiguously (Ghostty sends ctrl+tab /
# ctrl+shift+tab as \x00n / \x00p = prefix+n / prefix+p). The native
# per-workspace cycling stays reachable on these alt chords.
# NB: keep these above any [[keys.command]] header — bare keys after one are
# absorbed into that array element instead of [keys].
next_tab = "prefix+alt+n"
previous_tab = "prefix+alt+p"

[[keys.command]]
key = "ctrl+w"
type = "shell"
command = "/Users/jsc/Developer/jsc/me.sh/configs/apps/herdr/close-focused.sh"
description = "close pane / tab / workspace"

[theme]
name = "catppuccin"
auto_switch = false

[ui]
agent_panel_sort = "priority"
prompt_new_tab_name = false
show_agent_labels_on_pane_borders = true

# Agent rows: state icon + workspace + short title (pt -t, typically a
# ticket key) + agent name on one line; the body (pt -b, or bare `pt words`)
# is word-wrapped onto up to two extra lines. Tokens are reported by ~/bin/pt
# (source me.pt) — the shared applier used both by manual pt calls and by
# per-machine pane-title hooks registered in agent configs' overlay fragments,
# e.g. "● me.sh · SHP-399 · pi" + wrapped summary lines. Rows whose tokens are
# all missing disappear, so untitled agents stay one line. herdr has no native
# text wrapping — this is emulated script-side.
[ui.sidebar.agents]
# Inline { token = ..., dim = false } style tables: herdr renders agent-panel
# tokens (agent name + custom $tokens) with the same overlay0 gray as the
# space panel's branch/cwd rows PLUS a dim modifier, which made them near-
# unreadable. dim=false drops just that modifier so these match the lighter
# gray of the branch/cwd lines exactly, whatever the theme resolves
# overlay0 to.
rows = [
  ["state_icon", "workspace", { token = "$title_key", dim = false }, { token = "agent", dim = false }],
  [{ token = "$title_sum1", dim = false }],
  [{ token = "$title_sum2", dim = false }],
]

[ui.toast]
delivery = "system"

# Cross-workspace tab walking via ~/bin/herdr-tab-step: steps through every
# tab of every workspace in order (workspaces by number, tabs by number) and
# wraps globally, restoring what ~/bin/tmux-app-key did when herdr ran
# inside tmux. Ghostty ctrl+tab / ctrl+shift+tab send prefix+n / prefix+p.
[[keys.command]]
key = "prefix+n"
type = "shell"
command = "$HOME/bin/herdr-tab-step next"
description = "next tab across workspaces"

[[keys.command]]
key = "prefix+p"
type = "shell"
command = "$HOME/bin/herdr-tab-step previous"
description = "previous tab across workspaces"

# Move the focused space left/right in the sidebar (me.space-mover plugin).
[[keys.command]]
key = "shift+left"
type = "shell"
command = "herdr plugin action invoke move-left --plugin me.space-mover"

[[keys.command]]
key = "shift+right"
type = "shell"
command = "herdr plugin action invoke move-right --plugin me.space-mover"
