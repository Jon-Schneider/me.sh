id = "me.codex-retry"
name = "Codex Error Retry"
version = "1.0.0"
min_herdr_version = "0.9.4"
description = "Send go after Codex has been stopped at a capacity or Bad Request error for 30 seconds"
platforms = ["macos"]

[[startup]]
command = ["/usr/bin/python3", "retry.py"]

[[events]]
on = "pane.agent_detected"
command = ["/usr/bin/python3", "retry.py"]

[[events]]
on = "pane.agent_status_changed"
command = ["/usr/bin/python3", "retry.py"]

[[events]]
on = "pane.created"
command = ["/usr/bin/python3", "retry.py"]

[[actions]]
id = "start"
title = "Codex error retry: start watcher"
contexts = ["global", "workspace", "pane"]
command = ["/usr/bin/python3", "retry.py"]

[[actions]]
id = "status"
title = "Codex error retry: status"
contexts = ["global", "workspace", "pane"]
command = ["/usr/bin/python3", "retry.py", "--status"]
